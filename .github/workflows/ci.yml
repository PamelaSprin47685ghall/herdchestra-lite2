name: ci

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.4"
      - run: bun install --frozen-lockfile
      - run: bun install
        working-directory: host-omp
      - run: bun run lint
      - run: bun test tests

  host-smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      OMP_HOST: ${{ github.workspace }}/.omp-host
      OMP_SMOKE_STRICT: "1"
      OMP_SMOKE_BORROW: "0"
      OMP_NATIVE_BUILD_BACKEND: cargo
      OMP_NATIVE_CARGO_PROFILE: ci
      RUSTUP_TOOLCHAIN: nightly-2026-11-08
      CARGO_BUILD_JOBS: "2"
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.4"
      - run: bun install --frozen-lockfile
      - name: Check out the latest omp host
        uses: actions/checkout@v4
        with:
          repository: can1357/oh-my-pi
          path: .omp-host
      - name: Resolve the latest host commit
        id: host-rev
        working-directory: .omp-host
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Install host dependencies
        working-directory: .omp-host
        run: bun install --frozen-lockfile
      - name: Select the host native target
        id: native-target
        run: bun scripts/verify-host-native.mjs --target
      - name: Restore the exact host native addon
        id: native-cache
        uses: actions/cache/restore@v4
        with:
          path: |
            .omp-host/packages/natives/native/*.node
            .omp-host/packages/natives/native/index.js
            .omp-host/packages/natives/native/index.d.ts
          key: omp-native-ubuntu24-${{ runner.arch }}-${{ steps.host-rev.outputs.sha }}-bun1.4.4-nightly2026-11-08-ci-${{ steps.native-target.outputs.filename }}
      - name: Install native build dependencies
        if: steps.native-cache.outputs.cache-hit != 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential pkg-config libssl-dev clang libclang-dev cmake ninja-build
          rustup toolchain install "$RUSTUP_TOOLCHAIN" --profile minimal
      - name: Build the native addon from the latest host source
        if: steps.native-cache.outputs.cache-hit != 'true'
        working-directory: .omp-host
        run: bun run build:native
      - name: Verify native loading and version
        run: bun scripts/verify-host-native.mjs
      - name: Save the verified native build
        if: steps.native-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            .omp-host/packages/natives/native/*.node
            .omp-host/packages/natives/native/index.js
            .omp-host/packages/natives/native/index.d.ts
          key: ${{ steps.native-cache.outputs.cache-primary-key }}
      - name: Run the host seam smoke
        run: bun scripts/smoke-omp.mjs
      - name: Run the real Agent context smoke
        run: bun scripts/smoke-context.mjs
